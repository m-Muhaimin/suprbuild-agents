version: '3.8'

services:
  suprbuild-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suprbuild-agents
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_PATH: /app/data/suprbuild.db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      CORS_ORIGIN: "*"
      LOG_LEVEL: debug
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - /app/node_modules
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Redis for caching (future enhancement)
  redis:
     image: redis:7-alpine
     ports:
       - "6379:6379"
     volumes:
       - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:

networks:
  default:
    name: suprbuild-network
