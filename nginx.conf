# Nginx configuration for SuprBuild Agent Platform
# Place this in /etc/nginx/sites-available/suprbuild-agents
# Then enable with: sudo ln -s /etc/nginx/sites-available/suprbuild-agents /etc/nginx/sites-enabled/

upstream suprbuild_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.suprbuild.dev;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.suprbuild.dev;

    # SSL Configuration (obtain from Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.suprbuild.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.suprbuild.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logging
    access_log /var/log/nginx/suprbuild-access.log combined;
    error_log /var/log/nginx/suprbuild-error.log warn;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Client body size limit
    client_max_body_size 10M;

    # Rate limiting zones
    location /api/agents/register {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://suprbuild_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API rate limiting
    location /api/ {
        limit_req zone=api_limit burst=200 nodelay;
        proxy_pass http://suprbuild_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Well-known endpoints (no rate limit)
    location /.well-known/ {
        proxy_pass http://suprbuild_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://suprbuild_backend;
        access_log off;
    }

    # Static files (if any)
    location ~* ^/(images|css|js|fonts)/ {
        proxy_pass http://suprbuild_backend;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Root
    location / {
        proxy_pass http://suprbuild_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ \.env {
        deny all;
    }

    location ~ \.git {
        deny all;
    }
}
